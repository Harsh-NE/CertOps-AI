# Standalone lab environment: one nginx container serving 5 test TLS endpoints
# with different certificate risk profiles, all via SNI on a single port.
#
# Usage:
#   cd lab
#   ./generate_certs.sh
#   docker compose -f docker-compose.lab.yml up -d
#
# Then add these lines to your /etc/hosts (or C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1 app1.lab.local app2.lab.local app3.lab.local legacy.lab.local api.lab.local api-internal.lab.local
#
# Scan targets to feed the platform (see README "Scan a target" section):
#   app1.lab.local:8443
#   app2.lab.local:8443
#   app3.lab.local:8443
#   legacy.lab.local:8443
#   api.lab.local:8443
version: "3.8"
services:
  lab-nginx:
    image: nginx:1.27-alpine
    container_name: cert-lab-nginx
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
