server {
    listen 443 ssl;
    server_name legacy.lab.local;
    ssl_certificate     /etc/nginx/certs/legacy/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/legacy/privkey.pem;
    # deliberately allow weak/legacy protocol+ciphers for this one host
    # so the scanner has a "weak crypto" target to flag.
    ssl_protocols TLSv1.2;
    ssl_ciphers 'DEFAULT:@SECLEVEL=0';
    location / { return 200 "legacy.lab.local - weak crypto (RSA-1024/SHA-1)\n"; }
}
