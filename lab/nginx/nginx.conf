worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # SNI-based routing: each conf.d/*.conf server block below shares port 443
    # and nginx picks the right one based on the SNI hostname the scanner requests.
    include /etc/nginx/conf.d/*.conf;
}
