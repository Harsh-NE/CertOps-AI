apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-platform-frontend
spec:
  replicas: 2
  selector:
    matchLabels: { app: cert-platform-frontend }
  template:
    metadata:
      labels: { app: cert-platform-frontend }
    spec:
      containers:
        - name: frontend
          image: your-registry/cert-platform-frontend:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: cert-platform-frontend
spec:
  selector: { app: cert-platform-frontend }
  ports: [{ port: 80, targetPort: 80 }]
  type: LoadBalancer
